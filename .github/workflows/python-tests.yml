# The Python audio server and its package on Linux and macOS (docs/33), on every push: the
# server, the keystore (the real Keychain on macOS), start at login, updates, dictation with the
# fake engine, the settings window, and a pipx-style install. The Windows program is built and
# tested on the publisher's machine (it is signed there).
name: Python tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dictation server libraries (no engine, no model)
        run: python -m pip install fastapi "uvicorn[standard]" python-multipart numpy
      - name: A virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq xvfb
      - name: Tests (Linux)
        if: runner.os == 'Linux'
        working-directory: audio-server
        run: xvfb-run -a python -m unittest discover -s . -p "test_*.py" -v
      - name: Tests (macOS)
        if: runner.os == 'macOS'
        working-directory: audio-server
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Install as users do
        run: |
          python -m venv /tmp/user
          /tmp/user/bin/pip install .
          /tmp/user/bin/clew-audio-server --version
          /tmp/user/bin/clew-audio-server --check-update
